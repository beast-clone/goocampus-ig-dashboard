[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers applied to every response served by Netlify.
# Notes:
#   - HSTS forces HTTPS for the apex + subdomains for 1 year. Only enable in prod.
#   - CSP allows Meta/Instagram CDN images + videos (used for thumbnails) and Apify scraped media.
#   - frame-ancestors 'none' is the modern equivalent of X-Frame-Options DENY.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://*.cdninstagram.com https://*.fbcdn.net https://*.fna.fbcdn.net https://scontent-iad3-1.cdninstagram.com https://*.apify.com https://i.imgur.com https://*.supabase.co https://i.ytimg.com https://*.ggpht.com https://*.googleusercontent.com https://*.licdn.com https://media.licdn.com; media-src 'self' blob: https://*.cdninstagram.com https://*.fbcdn.net https://*.fna.fbcdn.net https://*.supabase.co; font-src 'self' data:; connect-src 'self' https://graph.facebook.com https://api.apify.com https://api.openai.com https://api.hikerapi.com https://*.supabase.co https://*.googleapis.com https://oauth2.googleapis.com https://api.linkedin.com; frame-src https://www.youtube-nocookie.com https://www.youtube.com; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"
